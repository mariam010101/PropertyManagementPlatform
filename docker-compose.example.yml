services:
  postgres:
    image: postgres:16
    container_name: pmp-postgres
    restart: unless-stopped
    environment:
  POSTGRES_USER: YOUR_USERNAME
  POSTGRES_PASSWORD: YOUR_PASSWORD
  POSTGRES_DB: pmp
    ports:
      - "5432:5432"
    volumes:
      - pmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pmp_pgdata:
